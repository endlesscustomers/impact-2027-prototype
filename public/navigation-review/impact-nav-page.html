#im-preview-stage{container-type:inline-size;width:100%;margin:0}
#impact-nav-concept{--im-row-edge:calc(clamp(12px,2cqw,24px) + clamp(0px,calc((100cqw - 840px)/30),8px));--im-paper:light-dark(#fff,#10243a);--im-ink:light-dark(#17283a,#f5f8fc);--im-line:light-dark(#e1e7ee,#30465e);--im-hover:light-dark(#edf4ff,#203e60);--im-page:light-dark(#f5f7fa,#0c1c2d);--im-mobile:light-dark(#f7fbfd,#10243a);font-family:ImpactPreview,Arial,sans-serif;color:var(--im-ink);background:var(--im-page);min-height:400px;isolation:isolate;position:relative;width:100%}
#impact-nav-concept *{box-sizing:border-box}
#impact-nav-concept button,#impact-nav-concept a{font:inherit}
#impact-nav-concept button{color:inherit}
#impact-nav-concept .im-header{background:var(--im-paper);position:sticky;top:0;z-index:20;box-shadow:none;transition:box-shadow 160ms ease}
#impact-nav-concept[data-scrolled="true"] .im-header{box-shadow:0 3px 12px light-dark(rgb(17 32 48 / 9%),rgb(0 0 0 / 24%))}
@media(prefers-reduced-motion:reduce){#impact-nav-concept .im-header{transition:none}}
#impact-nav-concept::before,#impact-nav-concept .im-header::before{content:"";position:absolute;inset-block:0;width:100vw;left:50%;transform:translateX(-50%);background:var(--im-page);z-index:-1;pointer-events:none}
#impact-nav-concept .im-header::before{background:var(--im-paper)}
#impact-nav-concept .im-top{width:100%;max-width:1280px;margin-inline:auto;min-height:57.6px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:5.4px var(--im-row-edge)}
#impact-nav-concept .im-logo{display:block;width:118.8px;height:auto}
@media(prefers-color-scheme:dark){#impact-nav-concept .im-logo{filter:invert(1)}}
#impact-nav-concept .im-actions{display:flex;align-items:center;justify-content:flex-end;gap:14.4px;margin-left:auto}
#impact-nav-concept .im-icon{display:grid;place-items:center;width:44px;height:44px;padding:8px;border:0;background:transparent;border-radius:50%;flex:none}
#impact-nav-concept .im-icon svg{width:20.7px;height:20.7px;stroke-width:1.8}
#impact-nav-concept .im-icon:hover{background:var(--im-hover)}
#impact-nav-concept .im-cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#0869f9;color:#fff;text-decoration:none;border:1.35px solid transparent;border-radius:27px;min-height:39.6px;padding:9px 20.7px;font-size:14.4px;font-weight:600;line-height:1.25;white-space:nowrap}
#impact-nav-concept .im-cta svg{width:14.4px;height:14.4px}
@media(pointer:coarse){#impact-nav-concept .im-cta,#impact-nav-concept .im-trigger,#impact-nav-concept .im-menu button{min-height:44px}}
#impact-nav-concept .im-cta:hover{background:#0054d3}
#impact-nav-concept .im-diagnostic{background:transparent;border-color:var(--im-ink);color:var(--im-ink)}
#impact-nav-concept .im-diagnostic:hover{background:var(--im-hover)}
#impact-nav-concept .im-navigation{width:100%;max-width:1280px;margin-inline:auto;display:flex;justify-content:space-between;flex-wrap:nowrap;gap:0;padding:0 clamp(12px,2cqw,24px);border-top:1px solid transparent;border-bottom:1px solid transparent;position:relative;isolation:isolate}
#impact-nav-concept .im-navigation::before,#impact-nav-concept .im-navigation::after{content:"";position:absolute;width:100vw;height:1px;left:50%;transform:translateX(-50%);background:var(--im-line);pointer-events:none}
#impact-nav-concept{--im-nav-surface:light-dark(#fbfbfc,#162b42)}
#impact-nav-concept .im-navigation::before{top:-1px;bottom:-1px;height:auto;width:100vw;background:var(--im-nav-surface);z-index:-1}
#impact-nav-concept .im-navigation::after{display:none}
#impact-nav-concept .im-item{position:relative;flex:0 0 auto}
#impact-nav-concept .im-trigger{color:inherit;display:flex;align-items:center;gap:clamp(1px,calc((100cqw - 840px)/50),4px);white-space:nowrap;min-height:44px;padding:9px clamp(0px,calc((100cqw - 840px)/30),8px);border:0;background:transparent;font-size:clamp(13.5px,calc(13.5px + (100cqw - 900px) * 0.0039473684),15px);font-weight:600;line-height:1.3}
#impact-nav-concept .im-trigger:hover,#impact-nav-concept .im-trigger[aria-expanded=true]{color:light-dark(#075ccf,#7eb5ff)}
#impact-nav-concept .im-trigger svg{width:12px!important;height:12px!important;flex:0 0 12px;stroke-width:1.75;color:light-dark(#7b8795,#9aaabb)}
#impact-nav-concept .im-trigger[aria-expanded=true] svg{transform:rotate(180deg)}
#impact-nav-concept .im-menu{position:absolute;left:0;top:calc(100% + 7.2px);width:234px;background:var(--im-paper);padding:9px;border-radius:10.8px;box-shadow:0 10.8px 32.4px #0002;z-index:4}
#impact-nav-concept .im-item:nth-last-child(-n+3) .im-menu{left:auto;right:0}
#impact-nav-concept .im-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9.9px 10.8px;border-radius:6.3px;font-size:13.5px;line-height:1.3}
#impact-nav-concept .im-menu button:hover{background:var(--im-hover)}

#impact-nav-concept .im-item.im-hubspot-item{position:static}
#impact-nav-concept .im-menu.im-mega{left:50%;transform:translateX(-50%);width:calc(100% - 48px);max-width:960px;padding:30px 34px 34px;border-radius:24px}

#impact-nav-concept .im-mega-overview{font-family:'General Sans',Arial,sans-serif;display:block;color:inherit;text-decoration:none;font-size:22px;font-weight:600;padding:0 0 24px;border-bottom:1px solid var(--im-line);margin-bottom:24px}
#impact-nav-concept .im-mega-overview:hover{color:#0866ed}
#impact-nav-concept .im-mega-grid{display:grid;grid-template-columns:1.1fr 1.15fr 1fr;gap:32px}
#impact-nav-concept .im-mega-heading{font-size:15px;font-weight:400;color:light-dark(#657180,#aab7c6);margin:0 0 12px}
#impact-nav-concept .im-mega button{font-size:15px;line-height:1.35;padding:10px 0;font-weight:500;min-height:40px}
#impact-nav-concept .im-mega button:hover{background:transparent;color:light-dark(#075ccf,#7eb5ff)}
#impact-nav-concept .im-mobile-hubspot .im-mega-grid{display:block}
#impact-nav-concept .im-mobile-hubspot .im-mega-heading{margin:24px 0 8px}
#impact-nav-concept .im-mobile-hubspot .im-mega-overview{font-size:21px;margin-top:20px}
#impact-nav-concept .im-mobile-hubspot button{display:block;background:none;border:0;color:inherit;text-align:left;padding:12px 0;min-height:44px;font-size:17px;width:100%}


#impact-nav-concept .im-menu-backdrop{position:fixed;inset:0;z-index:10;background:light-dark(rgb(20 30 45 / 8%),rgb(0 0 0 / 20%));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity 220ms ease,visibility 220ms}
#impact-nav-concept[data-desktop-open="true"] .im-menu-backdrop{opacity:1;visibility:visible;pointer-events:auto}
#impact-nav-concept .im-menu:not([hidden]){animation:im-panel-reveal 260ms cubic-bezier(.2,.7,.2,1) both}
#impact-nav-concept .im-menu:not([hidden]) .im-waterfall{animation:im-waterfall-reveal 360ms cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--im-reveal-delay,40ms)}
@keyframes im-panel-reveal{from{opacity:0;translate:0 -7px}to{opacity:1;translate:0 0}}
@keyframes im-waterfall-reveal{from{opacity:0;translate:0 -9px}to{opacity:1;translate:0 0}}
@media(hover:hover){
#impact-nav-concept:has(.im-item:hover>.im-menu) .im-menu-backdrop{opacity:1;visibility:visible;pointer-events:auto}
#impact-nav-concept .im-item:hover>.im-menu{animation:im-panel-reveal 260ms cubic-bezier(.2,.7,.2,1) both}
#impact-nav-concept .im-item:hover>.im-menu .im-waterfall{animation:im-waterfall-reveal 360ms cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--im-reveal-delay,40ms)}
}
@media(prefers-reduced-motion:reduce){
#impact-nav-concept .im-menu-backdrop{transition:none}
#impact-nav-concept .im-menu,#impact-nav-concept .im-menu .im-waterfall{animation:none!important}
}

#impact-nav-concept .im-menu::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px}
@media(hover:hover){#impact-nav-concept .im-item:hover>.im-menu{display:block}}
#impact-nav-concept .im-canvas{padding:52px 24px;min-height:160vh}
#impact-nav-concept .im-placeholder{height:9px;background:var(--im-line);max-width:220px;border-radius:5px;margin-bottom:16px;opacity:.55}
#impact-nav-concept .im-placeholder:last-of-type{max-width:140px}
#impact-nav-concept .im-selected{margin:0;font-size:16px;line-height:1.5}
#impact-nav-concept [hidden]{display:none!important}
#impact-nav-concept :focus-visible{outline:3px solid #3b88ff;outline-offset:3px}
#impact-nav-concept .im-mobile-toggle{display:none}
#impact-nav-concept .im-mobile-panel{background:var(--im-mobile);min-height:720px;padding:14px 24px 32px}
#impact-nav-concept .im-mobile-head{display:flex;align-items:center;justify-content:space-between;gap:10.8px;min-height:43.2px;margin-bottom:27px}
#impact-nav-concept .im-mobile-head .im-logo{width:99px}
#impact-nav-concept .im-back{display:flex;align-items:center;gap:12.6px;min-height:44px;padding:0;border:0;background:none;font-size:14.4px}

function openMobile(){menuScrollY=window.scrollY;window.scrollTo(0,0);closeDesktop();root.dataset.mobileOpen='true';toggle.setAttribute('aria-expanded','true');panel.hidden=false;mobileContent(null)}

function positionDropdown(dropdown,trigger){

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>

<script>(()=>{
const key='impact-preview-theme';
const system=matchMedia('(prefers-color-scheme: dark)');
const buttons=document.querySelectorAll('.im-theme-toggle');
function saved(){try{return localStorage.getItem(key)}catch{return null}}
function apply(mode){
const dark=mode==='dark';
document.documentElement.dataset.theme=mode;
document.documentElement.style.colorScheme=mode;
buttons.forEach(button=>{button.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');button.setAttribute('aria-pressed',String(dark))});
}
apply(saved()|| (system.matches?'dark':'light'));
buttons.forEach(button=>button.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem(key,next)}catch{}apply(next)}));
window.addEventListener('storage',event=>{if(event.key===key)apply(saved()||(system.matches?'dark':'light'))});
system.addEventListener('change',()=>{if(!saved())apply(system.matches?'dark':'light')});
})();
